spring:
  application:
    name: mc-acc
  profiles:
    active: DEV

  datasource:
    url: jdbc:postgresql://localhost:5432/account
    username: postgres
    password: postgres
    driver-class-name: org.postgresql.Driver

  jpa:
    show-sql: true

  liquibase:
    enabled: true
    change-log: classpath:/db.changelog/db.changelog-master.xml

server:
  port: 8080

---